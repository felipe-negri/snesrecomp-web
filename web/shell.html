<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SNES Recomp</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; color: #ccc; font: 14px system-ui, sans-serif; }
  /* a janela do SDL é redimensionável: ela acompanha o tamanho do canvas e encaixa o jogo nele, sem borrar */
  #canvas { display: block; width: 100vw !important; height: 100vh !important; outline: none; }
  #status { position: fixed; bottom: 8px; left: 0; right: 0; text-align: center; }
</style>
</head>
<body>
<canvas id="canvas" tabindex="-1" oncontextmenu="event.preventDefault()"></canvas>
<div id="status">Carregando…</div>
<script>
  var statusEl = document.getElementById('status');
  var Module = {
    canvas: document.getElementById('canvas'),
    arguments: ['--no-launcher', '/game.sfc'],
    print: function (t) { console.log(t); },
    printErr: function (t) { console.warn(t); },
    setStatus: function (t) { statusEl.textContent = t; statusEl.hidden = !t; },
    onRuntimeInitialized: function () { Module.canvas.focus(); },
  };
  window.addEventListener('error', function () { Module.setStatus('Erro, veja o console.'); });
</script>
{{{ SCRIPT }}}
</body>
</html>
